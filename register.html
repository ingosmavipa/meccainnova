<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse - Meccainnova</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; background: #ff6600; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #e55c00; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #ff6600; text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Crear Cuenta</h2>
    <form id="form-registro" onsubmit="registrarUsuario(event)">
        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="reg-nombre" required>
        </div>
        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="reg-email" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" required>
        </div>
        <button type="submit">Registrarse</button>
    </form>
    <div class="link">
        ¿Ya tienes cuenta? <a href="login.html">Ingresa aquí</a>
    </div>
</div>

<script>
function registrarUsuario(e) {
    e.preventDefault();
    let nombre = document.getElementById('reg-nombre').value;
    let email = document.getElementById('reg-email').value;
    let password = document.getElementById('reg-password').value;

    let usuarios = JSON.parse(localStorage.getItem('usuariosMeccainnova')) || [];

    let existe = usuarios.some(u => u.email === email);
    if (existe) {
        alert('Este correo ya está registrado.');
        return;
    }

    usuarios.push({ nombre, email, password });
    localStorage.setItem('usuariosMeccainnova', JSON.stringify(usuarios));
    
    alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
    window.location.href = 'login.html';
}
</script>

</body>
</html>
